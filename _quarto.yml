project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!includes/**"
    - "!pitchdeck/!*.qmd"
    - "!pitchdeck/wk-ai-in-praxis.qmd"
    - "!Courses/DLA/**"
  resources:
    - CNAME
    - site.js
    - site-components/**

jupyter: python3

lang: en-GB

website:
  title: "The Spotted Ape"
  favicon: images/favicon.png
  site-url: https://thespottedape.com
  description: "Executive workshops that help leadership teams make strategic decisions, develop capabilities and retain accountability as AI changes work."
  open-graph: true
  search: false
  navbar: false

format:
  html:
    page-layout: full
    section-divs: false
    toc: false
    minimal: false
    css: theme.css
    include-in-header: head.html
    include-before-body: navbar.html
    include-after-body: footer.html
