name: Publish Quarto Site

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages   # <-- REQUIRED

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build interactive homepage components
        run: npm ci && npm run build

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Render Solar investment course
        run: quarto render Courses/DLA

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs   # <-- adjust if your Quarto output folder is different

      - uses: actions/deploy-pages@v4
